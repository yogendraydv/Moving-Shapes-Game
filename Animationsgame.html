<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the  web page </title>
    <style> *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.container{
    width: 100vw;
    height: 100vh;
    background-color: beige;
    border: 5px solid black;
}
.box{
    width: 300px;
    height: 80px;
    background-color: blue;
    border: 3px solid yellow;
    border-radius: 5px;
    margin: 10px;
    position: relative;
    /* animation-name: rightMovement;
    animation-duration: 5s;
    animation-iteration-count: infinite;
    animation-delay: 1s;
    animation-timing-function: linear;
    animation-direction: alternate;  */
    animation: 5s linear 1s infinite alternate none running rightMovement;

}
@keyframes rightMovement {
    from{
        top:0;
        left:0;
    }
    to{
        top:0;
        left: 1200px;
    }
}
#box2{
    width: 350px;
    height: 80px;
    background-color: blue;
    border: 3px solid yellow;
    border-radius: 5px;
    margin: 10px;
    position: relative;
    /* animation-name: rightMovement;
    animation-duration: 5s;
    animation-iteration-count: 2;
    animation-delay: 1s;
    animation-timing-function: ease-in;
    animation-direction: alternate; */
    animation: 5s ease-in 1s infinite alternate none running leftMovement;
}
@keyframes leftMovement {
    from{
        top:620px;
        left:1200px;
    }
    to{
        top:620px;
        left: 0;
    }
}
#circle{
    width: 100px;
    height: 100px;
    background-color: blue;
    border: 3px solid yellow;
    border-radius: 50px;
    margin: 10px;
    position: relative;
    top:30%;
    left: 40%;
    animation: 10s ease-in-out 0s infinite alternate-reverse none running circleMovement;
}
@keyframes circleMovement {
    0%{
     top:1%;
     left:5%;
    }
    30%{
      top:5%;
      left:90%;
    }
    60%{
      top:50%;
      left:10%;
    }
    100%{
        top:50%;
        left:90%;

    }
}  </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
     
         <div id="box2"></div>
        <div id="circle"></div>
    </div>
</body>
</html>
